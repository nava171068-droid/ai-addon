name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: แตกไฟล์ zip
        run: unzip -o addon-ai-app.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: ติดตั้งและเตรียมโปรเจกต์
        working-directory: addon-ai-app
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: addon-ai-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: addon-ai-apk
          path: addon-ai-app/android/app/build/outputs/apk/debug/app-debug.apk
